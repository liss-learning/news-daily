<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>News Daily</title><!-- v4 2026-08-19 debug --><style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}:root{color-scheme:light}
body{font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,Noto Sans SC,system-ui,sans-serif;background:#f1f5f9;color:#1e293b;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:24px 20px 60px}
h1{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:4px}
.sub{font-size:13px;color:#64748b;margin-bottom:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:#64748b}
.stats strong{color:#334155}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:.15s;user-select:none}
.chip:hover{opacity:.85}.chip.sel{border-color:currentColor}
.chip-AI{background:#dbeafe;color:#1d4ed8}.chip-quant{background:#e0e7ff;color:#4338ca}.chip-finance{background:#cffafe;color:#0e7490}.chip-tech{background:#e0f2fe;color:#0369a1}.chip-media{background:#ede9fe;color:#6d28d9}.chip-all{background:#f1f5f9;color:#475569}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1;min-width:180px;max-width:340px}
.search input{width:100%;padding:7px 12px 7px 32px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff;outline:0;font-family:inherit;transition:border-color .15s}
.search input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:14px;pointer-events:none}
.date-rng{display:flex;align-items:center;gap:6px;font-size:13px;color:#64748b}
.date-rng input{width:120px;padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;font-family:inherit;background:#fff;outline:0}
.date-rng input:focus{border-color:#3b82f6}
.btn{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #cbd5e1;background:#fff;color:#475569;font-family:inherit;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#94a3b8}
.sbox{background:#fff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:24px;overflow:hidden}
.sbox-hdr{padding:10px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#475569;user-select:none}
.sbox-hdr:hover{background:#f8fafc}
.sbox-hdr .arr{transition:transform .2s;font-size:10px}
.sbox.open .sbox-hdr .arr{transform:rotate(90deg)}
.sbox-body{display:none;padding:0 16px 16px;font-size:13px;color:#475569;line-height:1.8}
.sbox.open .sbox-body{display:block}#ssb{min-height:60px;background:#fef3c7;border-radius:4px}#ssb.loaded{background:transparent}
.sbox-body h4{font-size:13px;color:#334155;margin:10px 0 4px}
.sbox-body ul{list-style:none;padding:0}
.sbox-body li{padding:2px 0}
.sbox-body li:before{content:"▸ ";color:#3b82f6}
.day{margin-bottom:32px}
.day-hdr{font-size:14px;font-weight:600;color:#334155;border-bottom:1px solid #e2e8f0;padding-bottom:8px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.day-hdr .cnt{font-size:12px;color:#94a3b8;font-weight:400}
.day-hdr .tday{font-size:10px;font-weight:700;color:#2563eb;background:rgba(37,99,235,.08);padding:2px 8px;border-radius:4px}
.sec{margin-bottom:16px}
.sec-hdr{font-size:12px;font-weight:600;padding:3px 8px;border-radius:4px;margin-bottom:6px;display:inline-block}
.sec-hdr .n{font-size:11px;opacity:.7}
.card{background:#fff;border:1px solid #e2e8f0;border-left:3px solid #cbd5e1;border-radius:0 4px 4px 0;padding:12px 16px;margin-bottom:6px;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#94a3b8;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.hide{display:none}
.card-AI{border-left-color:#1d4ed8}.card-quant{border-left-color:#4338ca}.card-finance{border-left-color:#0e7490}.card-tech{border-left-color:#0369a1}.card-media{border-left-color:#6d28d9}
.card-t{font-size:14.5px;font-weight:600;line-height:1.5;margin-bottom:4px}
.card-s{font-size:13px;color:#475569;line-height:1.6;margin-bottom:6px}
.card-m{font-size:11.5px;color:#94a3b8;display:flex;align-items:center;gap:8px}
.card-src{font-weight:500;color:#64748b}
.card-lnk{color:#64748b;text-decoration:none;margin-left:auto;font-size:11.5px}
.card-lnk:hover{color:#2563eb}
.hl{background:#fef08a;border-radius:2px;padding:0 1px}
.none{text-align:center;padding:48px 24px;color:#94a3b8;font-size:15px;display:none}
.none.show{display:block}
@media(max-width:600px){.wrap{padding:12px 14px 40px}h1{font-size:18px}.card{padding:10px 14px}.card-t{font-size:13.5px}.ctrl{flex-direction:column;align-items:stretch}.search{max-width:none}}
</style></head><body><div class="wrap">
<h1>新闻日报</h1><div class="sub" id="sub"></div><div class="stats" id="stats"></div>
<div class="ctrl"><div class="search"><span class="icon">&#x2318;</span><input type="text" id="q" placeholder="搜索标题/摘要/来源" autocomplete="off"></div><div class="date-rng"><input type="date" id="df"><span>-</span><input type="date" id="dt"><button class="btn" onclick="rstDate()">清除</button></div></div>
<div class="sbox" id="sm"><div class="sbox-hdr" onclick="document.getElementById('sm').classList.toggle('open')"><span class="arr">&#9654;</span> 日报摘要</div><div class="sbox-body" id="smb"></div></div>
<div class="sbox open" id="ss"><div class="sbox-hdr" onclick="document.getElementById('ss').classList.toggle('open')"><span class="arr">&#9654;</span> 来源统计</div><div class="sbox-body" id="ssb"></div></div>
<div class="none" id="nr">没有匹配的结果</div><div id="main"></div></div>
<script src="news-data.js"></script><script>
!function(){var D=window.NEWS_DATA;if(!D||!D.length){document.getElementById("main").textContent="No data";return}
var C=["AI","量化","财经","科技","自媒体"],CS={AI:"AI",量化:"quant",财经:"finance",科技:"tech",自媒体:"media"};
var today=(new Date()).toISOString().slice(0,10),cat="all",q="",df="",dt="";
var AD=Array.from(new Set(D.map(function(d){return d.date}))).sort();
var E=function(id){return document.getElementById(id)};
var st=E("stats"),mn=E("main"),qi=E("q"),nr=E("nr"),dff=E("df"),dtt=E("dt"),su=E("sub"),ssb=E("ssb");
dff.value=AD[0];dtt.value=AD[AD.length-1];
su.textContent="IT之家 + 新浪新闻 + 每日经济新闻 + 证券时报 + 财联社 + 36氪 等31个来源 | 每日 0:30 更新 | "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
function GF(){var a=dff.value||AD[0],b=dtt.value||AD[AD.length-1];var r=D.filter(function(d){return d.date>=a&&d.date<=b});if(cat!=="all")r=r.filter(function(d){return d.category===cat});if(q){var ql=q.toLowerCase();r=r.filter(function(d){return d.title.toLowerCase().indexOf(ql)>-1||d.summary.toLowerCase().indexOf(ql)>-1||d.source.toLowerCase().indexOf(ql)>-1})}return r}
function HL(t,q){if(!q)return t;return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<span class=hl>$1</span>")}
function R(){var r=GF(),cnt={};C.forEach(function(c){cnt[c]=0});r.forEach(function(d){cnt[d.category]++});var h="共 <strong>"+r.length+"</strong> 条 覆盖 <strong>"+new Set(r.map(function(d){return d.date})).size+"</strong> 天 ";h+="<span class=\"chip chip-all "+(cat==="all"?"sel":"")+"\" onclick=\"SC('all')\">全部</span> ";C.forEach(function(c){h+="<span class=\"chip chip-"+CS[c]+" "+(cat===c?"sel":"")+"\" onclick=\"SC('"+c+"')\">"+c+" "+cnt[c]+"</span> "});st.innerHTML=h;if(!r.length){nr.classList.add("show");mn.innerHTML="";return}nr.classList.remove("show");var days={};r.forEach(function(d){if(!days[d.date])days[d.date]=[];days[d.date].push(d)});var hm="";Object.keys(days).sort().reverse().forEach(function(day){var it=days[day];hm+="<div class=day><div class=day-hdr>"+day+" <span class=cnt>"+it.length+" 条</span>"+(day===today?" <span class=tday>Today</span>":"")+"</div>";C.forEach(function(c){var ci=it.filter(function(d){return d.category===c});if(!ci.length)return;var cs=CS[c];hm+="<div class=sec><div class=\"sec-hdr chip-"+cs+"\">"+c+" <span class=n>"+ci.length+" 条</span></div>";ci.forEach(function(d){hm+="<div class=\"card card-"+cs+"\"><div class=card-t>"+HL(d.title,q)+"</div><div class=card-s>"+HL(d.summary,q)+"</div><div class=card-m><span class=card-src>"+HL(d.source,q)+"</span><a class=card-lnk href=\""+d.sourceUrl+"\" target=_blank rel=noopener>查看原文</a></div></div>"});hm+="</div>"});hm+="</div>"});mn.innerHTML=hm;R2();R3()}
window.SC=function(c){cat=c;R()};qi.addEventListener("input",function(){q=this.value.trim();R()});qi.addEventListener("keydown",function(e){if(e.key==="Escape"){this.value="";q="";R()}});dff.addEventListener("change",R);dtt.addEventListener("change",R);window.rstDate=function(){dff.value=AD[0];dtt.value=AD[AD.length-1];R()};document.addEventListener("keydown",function(e){if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();qi.focus()}if(e.key==="Escape"&&document.activeElement!==qi){cat="all";qi.value="";q="";dff.value=AD[0];dtt.value=AD[AD.length-1];R()}});
function R2(){var r=GF(),ti=r.filter(function(d){return d.date===today});var cnt={};C.forEach(function(c){cnt[c]=0});r.forEach(function(d){cnt[d.category]++});var tc={};C.forEach(function(c){tc[c]=0});ti.forEach(function(d){tc[d.category]++});var src={};r.forEach(function(d){src[d.source]=(src[d.source]||0)+1});var sk=Object.keys(src).sort(function(a,b){return src[b]-src[a]});var h="<h4>数据总览</h4><ul><li>总: <strong>"+r.length+"</strong> 条, <strong>"+new Set(r.map(function(d){return d.date})).size+"</strong> 天</li><li>分类: "+C.map(function(c){return c+" "+cnt[c]}).join(", ")+"</li><li>来源占比: "+sk.map(function(s){return s+" "+src[s]+" ("+Math.round(src[s]/r.length*100)+"%)"}).join(" | ")+"</li></ul>";if(ti.length>0){h+="<h4>今日要闻 ("+today+" "+ti.length+" 条)</h4><ul><li>分类: "+C.filter(function(c){return tc[c]>0}).map(function(c){return c+" "+tc[c]}).join(", ")+"</li><li>热点头条: <ol style=\"margin:4px 0;padding-left:20px\">";ti.slice(0,8).forEach(function(d){h+="<li>["+d.category+"] "+d.title+" ("+d.source+")</li>"});h+="</ol></li></ul>"}E("smb").innerHTML=h}
function R3(){var r=GF(),src={};r.forEach(function(d){src[d.source]=(src[d.source]||0)+1});var sk=Object.keys(src).sort(function(a,b){return src[b]-src[a]});var colors=["linear-gradient(90deg,#2563eb,#3b82f6)","linear-gradient(90deg,#7c3aed,#8b5cf6)","linear-gradient(90deg,#0891b2,#06b6d4)","linear-gradient(90deg,#ea580c,#f97316)","linear-gradient(90deg,#16a34a,#22c55e)","linear-gradient(90deg,#dc2626,#ef4444)","linear-gradient(90deg,#ca8a04,#eab308)"];var h="<h4>来源统计（共 "+r.length+" 条）</h4><div style=\"margin-top:10px\">";sk.forEach(function(s,i){var c=src[s],pct=Math.round(c/r.length*100),w=Math.max(pct,0.3),co=pct>=1?colors[i%7]:"#94a3b8",tc=pct>=1?"#64748b":"#94a3b8",nc=pct>=1?"#334155":"#94a3b8";h+="<div style=\"display:flex;align-items:center;margin-bottom:4px;font-size:12px\"><span style=\"width:120px;flex-shrink:0;text-align:right;padding-right:8px;color:"+nc+"\">"+s+"</span><span style=\"flex:1;background:#e2e8f0;border-radius:4px;height:16px;position:relative\"><span style=\"display:block;height:100%;width:"+w+"%;background:"+co+";border-radius:4px\"></span></span><span style=\"width:80px;flex-shrink:0;padding-left:8px;color:"+tc+";font-weight:600\">"+c+" ("+pct+"%)</span></div>"});h+="</div>";E("ssb").innerHTML=h}
R();R3()}();</script></body></html>
