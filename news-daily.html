<script>
(function() {
  var D = window.NEWS_DATA;
  if (!D || !D.length) { document.getElementById('main').textContent = 'No data loaded.'; return; }
  var today = new Date().toISOString().slice(0, 10);
  var CATS = ['AI','量化','财经','科技','自媒体'];
  var activeCat = 'all';
  var searchQuery = '';
  document.getElementById('todayDate').textContent = today;
  var dates = [];
  D.forEach(function(a){ if(dates.indexOf(a.date)<0) dates.push(a.date); });
  dates.sort().reverse();
  var catCounts = {};
  CATS.forEach(function(c){ catCounts[c] = D.filter(function(a){return a.category===c;}).length; });
  document.getElementById('statsBar').innerHTML =
    '<span>共 <strong>' + D.length + '</strong> 条</span><span>覆盖 <strong>' + dates.length + '</strong> 天</span><span>最新 <strong>' + dates[0] + '</strong></span>';
  var pillsEl = document.getElementById('pills');
  var pillsHTML = '<button class="pill active" data-cat="all">全部<span class="pill-count">(' + D.length + ')</span></button>';
  CATS.forEach(function(c){ pillsHTML += '<button class="pill" data-cat="' + c + '">' + c + '<span class="pill-count">(' + catCounts[c] + ')</span></button>'; });
  pillsEl.innerHTML = pillsHTML;
  pillsEl.addEventListener('click', function(e){
    var btn = e.target.closest('.pill'); if(!btn) return;
    document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active');});
    btn.classList.add('active'); activeCat = btn.dataset.cat; render();
  });
  document.getElementById('searchInput').addEventListener('input', function(e){
    searchQuery = e.target.value.trim().toLowerCase(); render();
  });
  function render(){
    var main = document.getElementById('main');
    var filtered = D;
    if(activeCat !== 'all') filtered = filtered.filter(function(a){return a.category===activeCat;});
    if(searchQuery) filtered = filtered.filter(function(a){
      return (a.title+'|'+a.summary+'|'+a.source).toLowerCase().indexOf(searchQuery)>=0;
    });
    if(!filtered.length){ main.innerHTML = '<div class="no-results visible">没有匹配的新闻</div>'; return; }
    var grouped = {};
    filtered.forEach(function(a){ if(!grouped[a.date]) grouped[a.date]=[]; grouped[a.date].push(a); });
    var sortedDates = Object.keys(grouped).sort().reverse();
    var html = '';
    sortedDates.forEach(function(d){
      var items = grouped[d];
      html += '<div class="day-group"><div class="day-header"><span>' + d + '</span><span class="day-count">' + items.length + ' 条</span>' + (d===today ? '<span class="today-badge">Today</span>' : '') + '</div>';
      items.forEach(function(a){
        html += '<div class="card border-' + a.category + '"><div class="card-title">' + esc(a.title) + '</div><div class="card-summary">' + esc(a.summary) + '</div><div class="card-meta"><span class="cat-tag tag-' + a.category + '">' + a.category + '</span><span class="card-source">' + esc(a.source) + '</span>';
        if(a.sourceUrl) html += '<a class="card-link" href="' + escAttr(a.sourceUrl) + '" target="_blank" rel="noopener">查看原文 &#8599;</a>';
        html += '</div></div>';
      });
      html += '</div>';
    });
    main.innerHTML = html;
  }
  function esc(s){ if(!s) return ''; var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function escAttr(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); }
  render();
})();
</script>
